<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pool Control Card — simulated preview</title><style>body{margin:0;background:#081923;color:#f5f3ed;font-family:Arial,sans-serif}.demo-toolbar{padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:#b2c1ca}.demo-toolbar button{padding:8px 12px;color:inherit;background:#142734;border:1px solid #263b48;border-radius:8px;min-height:44px;cursor:pointer}#preview{max-width:1194px;margin:auto}#preview.card{max-width:520px}.calls{padding:12px 24px;color:#b2c1ca;font-size:12px}ha-icon{display:inline-flex;align-items:center;justify-content:center;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}</style></head><body><div class="demo-toolbar"><strong>Simulated equipment · no Home Assistant connection</strong><button id="panel">Panel preview</button><button id="card">Card preview</button><button id="missing">Missing readings</button><button id="empty">No equipment</button></div><div id="preview"></div><div class="calls" role="status">No simulated commands sent.</div>
<script>
const paths = {
'mdi:plus':'M12 4v16M4 12h16', 'mdi:minus':'M4 12h16',
'mdi:pump':'M4 9h4a7 7 0 1 1-1 10H3v-5h4M10 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0M17 7V3h4v8',
'mdi:heat-wave':'M6 21c-6-6 6-10 0-18M12 21c-6-6 6-10 0-18M18 21c-6-6 6-10 0-18',
'mdi:power':'M12 2v10M6 5a9 9 0 1 0 12 0',
'mdi:water-outline':'M12 2C9 7 4 11 4 15a8 8 0 0 0 16 0c0-4-5-8-8-13Z',
'mdi:lightning-bolt':'M13 2 4 14h7l-1 8 10-13h-8Z',
'mdi:lightbulb-outline':'M8 17v-2a7 7 0 1 1 8 0v2ZM8 20h8M10 23h4',
'mdi:chevron-right':'m9 5 7 7-7 7',
'mdi:waves':'M2 6q2-3 5 0t5 0t5 0t5 0M2 12q2-3 5 0t5 0t5 0t5 0M2 18q2-3 5 0t5 0t5 0t5 0'
};
customElements.define('ha-icon', class extends HTMLElement { connectedCallback(){ if(this.shadowRoot)return;this.attachShadow({mode:'open'}).innerHTML='<style>:host{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);flex-shrink:0}svg{display:block}</style><svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"><path d="'+(paths[this.getAttribute('icon')]||paths['mdi:waves'])+'"/></svg>'; } });
</script><script src="../pool-control-card.js"></script><script>
const entityKeys = {water:['sensor','82',{unit_of_measurement:'°F'}],air:['sensor','76',{unit_of_measurement:'°F'}],heater:['water_heater','on',{temperature:85,min_temp:55,max_temp:90}],heating:['binary_sensor','on'],pump:['switch','on'],speed:['number','80',{min:30,max:100,step:1}],low:['button','unknown',{speed:50}],medium:['button','unknown',{speed:80}],high:['button','unknown',{speed:100}],power:['sensor','940'],flow:['binary_sensor','on'],lights:['light','on',{effect:'Deep Blue Sea',effect_list:['Deep Blue Sea','Tranquility','Cloud White']}],landscape:['switch','off'],salt:['sensor','3200',{unit_of_measurement:'ppm'}],instantSalt:['sensor','3250'],chlorinator:['switch','on'],generating:['binary_sensor','on'],output:['number','45',{min:0,max:100,step:1}],fault:['binary_sensor','off'],alert:['binary_sensor','off'],serviceMode:['binary_sensor','off'],restore:['button','unknown']};
const config = {type:'custom:pool-control-card',title:'Pool',area:'GARDEN',controller:'Pool controller',layout:'panel',image:'/local/demo-pool.svg',image_caption:'A little time outside',entities:{}};
const states={};for(const[key,[domain,value,attrs]]of Object.entries(entityKeys)){const id=domain+'.demo_'+key.toLowerCase();config.entities[key]=id;states[id]={entity_id:id,state:value,attributes:attrs||{},last_updated:new Date().toISOString()};}
const card=document.createElement('pool-control-card');const preview=document.querySelector('#preview');preview.append(card);
const hass={connected:true,config:{unit_system:{temperature:'°F'}},states,callService:async(domain,service,data)=>{document.querySelector('.calls').textContent='Simulated command: '+JSON.stringify({domain,service,data});}};
function render(){card.setConfig(config);card.hass=hass;}
document.querySelector('#panel').onclick=()=>{config.layout='panel';preview.className='';render();};
document.querySelector('#card').onclick=()=>{config.layout='card';preview.className='card';render();};
document.querySelector('#missing').onclick=()=>{states[config.entities.water].state='unavailable';states[config.entities.pump].state='off';render();};
document.querySelector('#empty').onclick=()=>{card.setConfig({type:config.type});card.hass=hass;};
render();
</script></body></html>
